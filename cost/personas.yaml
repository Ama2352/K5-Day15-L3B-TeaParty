# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
  low: 100
  base: 500
  high: 2000
  source: "(tự ước tính) quy mô thử nghiệm qua 1–3 tổ chức hỗ trợ hoặc văn phòng luật; nhóm chưa có số công khai về người cần chuẩn bị hồ sơ quấy rối tình dục nơi làm việc. Khảo sát n = 21: 2/21 tự gặp vấn đề mang tính tình dục (evidence/summary.md), không đủ để suy ra quy mô."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
                    # Nguồn chung: khảo sát câu 8 (số lần chuẩn bị hoặc bổ sung tài liệu trong 12 tháng), n = 13 người có trường hợp, chia 12 ra lần / tháng.
                    # Quy đổi khoảng thành số (tự ước tính): 1 lần = 1 · 2–3 = 2,5 · 4–6 = 5 · 7–12 = 9,5 · trên 12 = 13.
  - name: dung_it
    share: 0.385            # 5/13: chọn 1 lần (S04, S21) hoặc 2–3 lần (S12, S16, S20)
    uses_per_month: 0.16    # (2×1 + 3×2,5) / 5 / 12
    turns_per_session: 1    # (tự ước tính) mức 1 lượt tạo hoặc sửa bản nháp trong thẻ đề
    source: "khảo sát câu 8, n = 13 (evidence/survey/results.csv); spec.md §2. Số lượt / phiên: (tự ước tính)"
  - name: dung_vua
    share: 0.46             # 6/13: chọn 4–6 lần (S05, S09, S11, S17, S18, S19)
    uses_per_month: 0.42    # 5 / 12
    turns_per_session: 2    # (tự ước tính) mức 2 lượt trong thẻ đề
    source: "khảo sát câu 8, n = 13 (evidence/survey/results.csv); spec.md §2. Số lượt / phiên: (tự ước tính)"
  - name: dung_nhieu
    share: 0.155            # 2/13: chọn 7–12 lần (S13) hoặc trên 12 lần (S14) — cả hai là người hỗ trợ người khác
    uses_per_month: 0.94    # (9,5 + 13) / 2 / 12
    turns_per_session: 4    # (tự ước tính) mức 4 lượt trong thẻ đề
    source: "khảo sát câu 8, n = 13 (evidence/survey/results.csv); spec.md §2. Số lượt / phiên: (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — giá giờ cao điểm, input tính cache miss (mức cao, an toàn khi ước chi phí). ≥2 mức model
  - model: deepseek-flash
    input: 0.30
    output: 1.20
    source: "https://api-docs.deepseek.com/quick_start/pricing · xem 28/11/2026 · DeepSeek-V4.1-Flash-1017, giá peak, cache miss (off-peak bằng một nửa)"
  - model: deepseek-v4-pro
    input: 1.32
    output: 3.96
    source: "https://api-docs.deepseek.com/quick_start/pricing · xem 28/11/2026 · DeepSeek-V4-Pro-0813, giá peak, cache miss (off-peak bằng một nửa)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
